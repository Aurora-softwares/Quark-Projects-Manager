[package]
name = "quark-projects-manager"
version = "0.2.4"
edition = "2021"
license = "MIT"
description = "Native Rust desktop manager for GitHub Projects"

[dependencies]
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
rfd = "0.15"
serde_json = "1"
csv = "1.3"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }

[profile.release]
strip = true
lto = "thin"

[dev-dependencies]
tempfile = "3"
